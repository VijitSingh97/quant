[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "basis"
version = "0.1.0"
description = "Market-neutral crypto carry & volatility toolkit (stdlib-only)"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "vijit" }]
keywords = ["crypto", "funding", "carry", "basis-trade", "perpetuals", "delta-neutral", "volatility", "quant", "backtest"]
dependencies = []   # intentionally stdlib-only (research + paper need NOTHING extra)

[project.optional-dependencies]
dev = ["pytest>=7"]
# Only needed to sign/submit LIVE Hyperliquid orders (Phase 3). Paper/research never use these.
live = ["hyperliquid-python-sdk>=0.9.0", "eth-account>=0.10.0"]

[project.scripts]
basis-dashboard  = "basis.dashboard:main"
basis-monitor    = "basis.monitor:main"
basis-carry      = "basis.backtests.carry:main"
basis-vrp        = "basis.backtests.vrp:main"
basis-combined   = "basis.backtests.combined:main"
basis-histskew   = "basis.backtests.histskew:main"
basis-robust     = "basis.backtests.robustness:main"
basis-condor-bt  = "basis.backtests.structures:main"
basis-structures = "basis.structures:main"
basis-skew       = "basis.skew:main"
basis-book       = "basis.book:main"
basis-size       = "basis.size:main"
basis-analyze    = "basis.analyze:main"
basis-macro      = "basis.macro:main"
basis-backfill   = "basis.backfill:main"
basis-carry-scan = "basis.carryscan:main"
basis-rotation   = "basis.backtests.rotation:main"
basis-regime     = "basis.backtests.regime:main"
basis-validate   = "basis.live.validate:cli"
basis-tune       = "basis.live.tune:cli"
basis-preflight  = "basis.live.preflight:main"
basis-log        = "basis.logger:main"
basis-live       = "basis.live.engine:main"
basis-live-monitor = "basis.live.monitor:main"
basis-live-web   = "basis.live.web:main"
basis-live-auto  = "basis.live.auto:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"basis.live" = ["*.html"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
# Default run is OFFLINE: integration (live-venue) tests are opt-in via `-m integration`.
addopts = "-m 'not integration'"
markers = ["integration: hits live venues over the network (opt-in; run with make test-integration)"]
